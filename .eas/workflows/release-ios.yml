# Builds the iOS app on Expo's servers and uploads it to App Store Connect,
# where it shows up in TestFlight and can be submitted for review.
# Run it from the project's Workflows page on expo.dev, or with:
#   npx eas-cli@latest workflow:run .eas/workflows/release-ios.yml
name: Release to App Store Connect

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production
  submit_ios:
    name: Submit to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
